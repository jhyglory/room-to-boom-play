<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1240" width="760" height="1240" role="img" aria-label="Blank arcade completion panel shell">
  <defs>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#234e7d"/>
      <stop offset=".19" stop-color="#102f52"/>
      <stop offset=".67" stop-color="#0b2543"/>
      <stop offset="1" stop-color="#061a32"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9ec"/>
      <stop offset=".43" stop-color="#fff2dc"/>
      <stop offset="1" stop-color="#e8d5b3"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".51" stop-color="#fff6e7"/>
      <stop offset="1" stop-color="#f5e6cc"/>
    </linearGradient>
    <radialGradient id="amber" cx=".38" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff6a1"/>
      <stop offset=".38" stop-color="#ffcd46"/>
      <stop offset=".78" stop-color="#ff8d18"/>
      <stop offset="1" stop-color="#ad4d0d"/>
    </radialGradient>
    <radialGradient id="mint" cx=".38" cy=".25" r=".7">
      <stop offset="0" stop-color="#d8ffea"/>
      <stop offset=".45" stop-color="#6bdfb1"/>
      <stop offset="1" stop-color="#198d69"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-12%" width="130%" height="128%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Flat artwork only: names, times, and controls are separate overlay layers. -->
  <rect x="14" y="20" width="732" height="1205" rx="64" fill="#071c32" opacity=".3" filter="url(#shadow)"/>
  <rect x="7" y="7" width="746" height="1226" rx="64" fill="url(#navy)" stroke="#06182e" stroke-width="5"/>
  <rect x="15" y="13" width="730" height="1212" rx="58" fill="none" stroke="#5d87b6" stroke-width="3" opacity=".55"/>
  <path d="M69 38h622M39 100v1032M721 100v1032M70 1201h620" fill="none" stroke="#72a1d0" stroke-width="3" opacity=".18" stroke-linecap="round"/>
  <rect x="31" y="32" width="698" height="1170" rx="48" fill="url(#rim)" stroke="#061b32" stroke-width="5"/>
  <rect x="42" y="42" width="676" height="1149" rx="41" fill="url(#cream)" stroke="#d0b994" stroke-width="2"/>
  <path d="M92 56h574M59 102v1037M701 102v1037M92 1177h574" fill="none" stroke="#fffdf6" stroke-width="4" opacity=".9" stroke-linecap="round"/>
  <path d="M95 71h570" stroke="#d6c2a3" stroke-width="2" opacity=".48" stroke-linecap="round"/>
  <path d="M36 1180h688" stroke="#04162d" stroke-width="3" opacity=".45"/>
  <path d="M85 1214h590" stroke="#8aa5c2" stroke-width="2" opacity=".25" stroke-linecap="round"/>
  <!-- Corner indicator lamps are confined to the border for nine-slice stability. -->
  <g>
    <circle cx="48" cy="48" r="22" fill="#ffab29" opacity=".25" filter="url(#glow)"/>
    <circle cx="712" cy="48" r="22" fill="#ffab29" opacity=".25" filter="url(#glow)"/>
    <circle cx="48" cy="1187" r="22" fill="#ffab29" opacity=".25" filter="url(#glow)"/>
    <circle cx="712" cy="1187" r="22" fill="#ffab29" opacity=".25" filter="url(#glow)"/>
    <circle cx="48" cy="48" r="17" fill="#061a31" stroke="#375373" stroke-width="3"/>
    <circle cx="712" cy="48" r="17" fill="#061a31" stroke="#375373" stroke-width="3"/>
    <circle cx="48" cy="1187" r="17" fill="#061a31" stroke="#375373" stroke-width="3"/>
    <circle cx="712" cy="1187" r="17" fill="#061a31" stroke="#375373" stroke-width="3"/>
    <circle cx="48" cy="48" r="11.5" fill="url(#amber)" stroke="#ffd761" stroke-width="2"/>
    <circle cx="712" cy="48" r="11.5" fill="url(#amber)" stroke="#ffd761" stroke-width="2"/>
    <circle cx="48" cy="1187" r="11.5" fill="url(#amber)" stroke="#ffd761" stroke-width="2"/>
    <circle cx="712" cy="1187" r="11.5" fill="url(#amber)" stroke="#ffd761" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#061a31" stroke-width="4" stroke-linecap="round" opacity=".65">
    <path d="M16 1100h10m-10 10h10m-10 10h10M734 1100h10m-10 10h10m-10 10h10"/>
  </g>
  <circle cx="22" cy="1160" r="7" fill="url(#mint)" stroke="#071b31" stroke-width="3"/>
  <circle cx="738" cy="1160" r="7" fill="url(#mint)" stroke="#071b31" stroke-width="3"/>
</svg>
